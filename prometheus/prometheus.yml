global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "grafana"
    static_configs:
      - targets:
          - "grafana:3000"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  # HTTP monitoring for 3dots.agency
  - job_name: "blackbox"
    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:
      - targets:
          - "https://3dots.agency"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  # DNS monitoring for 3dots.agency
  - job_name: "blackbox-dns"
    metrics_path: /probe

    params:
      module:
        - dns_3dots

    static_configs:
      - targets:
          - "8.8.8.8:53"

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

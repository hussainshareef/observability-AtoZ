groups:

  - name: blackbox-alerts

    rules:

      - alert: WebsiteDown
        expr: probe_success{job="blackbox"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "3dots.agency is DOWN"
          description: "The website 3dots.agency has failed the HTTP probe for more than 1 minute."

      - alert: DNSDown
        expr: probe_success{job="blackbox-dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "3dots.agency DNS is DOWN"
          description: "DNS resolution probe for 3dots.agency has failed for more than 1 minute."

      - alert: WebsiteHighResponseTime
        expr: probe_duration_seconds{job="blackbox"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "3dots.agency response time is high"
          description: "Website response time has been above 2 seconds for more than 5 minutes."

      - alert: WebsiteSSLCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "3dots.agency SSL certificate expires soon"
          description: "The SSL certificate has less than 14 days remaining."
